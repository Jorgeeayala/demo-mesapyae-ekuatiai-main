<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EDE1">
<title>Administración · Mesa Pya'e · Tu Local</title>
<link rel="icon" href="assets/logo-local.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tu Local">
<link rel="stylesheet" href="assets/app.css">
<style>
  .bar { height: 8px; background: var(--tierra); border-radius: 4px; }
  .qr-sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .qr-card { text-align: center; padding: 16px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; break-inside: avoid; }
  .qr-card svg { width: 180px; height: 180px; }
  .qr-card .mn { font-family: var(--f-tit); font-size: 1.5rem; text-transform: uppercase; }
  .qr-card img { width: 110px; }
  .print-only { display: none; }
  @media print {
    .print-only { display: block; } #main > :not(.print-only) { display: none !important; }
    .qr-sheet { grid-template-columns: repeat(2, 1fr); } .qr-card { page-break-inside: avoid; border: 1px dashed #999; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/config.js"></script>
<script src="assets/lib.js"></script>
<script src="assets/realtime.js"></script>
<script src="assets/qr.js"></script>
<script src="assets/stock.js"></script>
<script src="assets/atencion.js"></script>
<script src="assets/carta-ia-ui.js"></script>
<script>
(function () {
  var M = Mesa, esc = M.esc, gs = M.gs;
  var S = { vista: 'resumen', admin: null, rep: null, desde: null, hasta: null, catFiltro: '', q: '', base: '' };
  var baseDefault = location.origin + location.pathname.replace(/[^/]*$/, '');
  try { S.base = localStorage.getItem('mesapyae.baseUrl') || baseDefault; } catch (e) { S.base = baseDefault; }
  var ROL_TXT = { ADMIN: 'Encargado / Admin', MOZO: 'Mozo', COCINA: 'Cocina', CAJA: 'Caja' };

  M.staffPage({ modulo: 'Administración', roles: ['ADMIN'], render: start });

  function hoy() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Asuncion' }).format(new Date()); }
  function start() {
    S.desde = S.hasta = hoy();
    document.getElementById('app').innerHTML = M.topbar('Administración') + '<main id="main"></main>';
    M.$('#main').addEventListener('click', onClick);
    M.$('#main').addEventListener('change', onChange);
    M.$('#main').addEventListener('input', onInput);
    load();
  }
  function load() {
    return Promise.all([M.call('admin.data', {}), M.call('admin.report', { desde: S.desde, hasta: S.hasta }), cargarRec(), cargarRes()]).then(function (r) { S.admin = r[0]; S.rep = r[1]; render(); }, err);
  }
  function reload() { return M.call('admin.data', {}).then(function (d) { S.admin = d; render(); }, err); }

  function render() {
    var tabs = [['resumen', 'Resumen'], ['catalogo', 'Catálogo'], ['grupos', 'Opciones'], ['mesas', 'Mesas y QR'], ['usuarios', 'Usuarios'], ['config', 'Configuración'], ['auditoria', 'Auditoría']];
    if (S.res && S.res.licencia) tabs.splice(1, 0, ['resenas', '★ Reseñas']);
    if (M.session.usuario.plataforma) tabs.push(['licencia', '⚙ Licencia (SoL)']);
    if (S.rec && S.rec.licencia) tabs.splice(1, 0, ['recompensas', '★ Recompensas']);
    if (tieneStock()) tabs.splice(2, 0, ['stock', '💰 Mesa Viru']);
    if (tieneModulo('ATENCION')) tabs.splice(2, 0, ['whatsapp', '💬 WhatsApp']);
    var h = '<div class="tabs no-print" style="margin-bottom:14px">' + tabs.map(function (t) { return '<button class="tab' + (S.vista === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
    var f = { stock: function () { return '<div id="stock-root"></div>'; }, whatsapp: function () { return '<div id="wa-root"></div>'; }, licencia: licencia, resenas: resenas, recompensas: function () { return S.rec && S.rec.licencia ? recompensas() : recSinLicencia(); }, resumen: resumen, catalogo: catalogo, grupos: grupos, mesas: mesas, usuarios: usuarios, config: config, auditoria: auditoria }[S.vista];
    M.$('#main').innerHTML = h + '<div id="view">' + (f ? f() : '') + '</div>';
    if (S.vista === 'stock' && window.StockAdmin) StockAdmin.mount(M.$('#stock-root'), { menu: S.admin.menu });
    if (S.vista === 'whatsapp' && window.AtencionAdmin) AtencionAdmin.mount(M.$('#wa-root'));
    if (S.vista === 'auditoria' && !S.audit) M.call('admin.audit', {}).then(function (a) { S.audit = a.auditoria; render(); }, err);
  }

  function tieneStock() { return tieneModulo('STOCK'); }
  function tieneModulo(m) { return !!(S.admin && S.admin.plan && (S.admin.plan.modulos || []).indexOf(m) >= 0); }
  // Resumen: costo de ventas, ganancia y margen por plato (Upgrade Mesa Viru) y tiempos por estación.
  function resumenStock(r) {
    var st = r.stock, te = r.tiempos_por_estacion || [], h = '';
    if (te.length > 1) h += '<div class="card pad" style="margin-top:14px"><h2>Tiempo por estación</h2><p class="small muted">Desde que se aceptó el pedido hasta que cada estación marcó su parte lista.</p><table class="tbl"><tbody>' +
      te.map(function (x) { return '<tr><td>' + esc(x.nombre) + '</td><td class="r num">mediana <strong>' + x.mediana + ' min</strong></td><td class="r num small muted">promedio ' + x.promedio + ' min · ' + x.muestras + ' pedidos</td></tr>'; }).join('') + '</tbody></table></div>';
    if (!st) return h;
    var cant = window.StockAdmin ? StockAdmin.cant : function (n) { return n; };
    return '<div class="kpis" style="margin-top:14px" data-stock-kpis>' + kpi('Ventas con receta', gs(st.ventas_con_costo_gs)) + kpi('Costo de insumos', gs(st.costo_ventas_gs)) +
      kpi('Ganancia bruta', gs(st.ganancia_bruta_gs), st.margen_pct === null ? '' : 'margen ' + st.margen_pct + ' %') +
      kpi('Mermas y conteos', gs(st.mermas_gs - st.diferencia_conteo_gs + st.consumo_sin_venta_gs), 'mermas ' + gs(st.mermas_gs) + ' · conteos ' + gs(st.diferencia_conteo_gs)) + '</div>' +
      (st.lineas_sin_receta ? '<p class="small muted">' + st.lineas_sin_receta + ' unidades vendidas sin receta cargada (no suman costo). Cargá sus recetas en 💰 Mesa Viru → Recetas y margen.</p>' : '') +
      '<div class="grid2" style="margin-top:14px"><div class="card pad"><h2>Qué te deja más plata</h2><table class="tbl" style="margin-top:8px"><thead><tr><th>Plato</th><th class="r">Vendidos</th><th class="r">Ganancia</th><th class="r">Margen</th></tr></thead><tbody>' +
      (st.productos.length ? st.productos.slice(0, 15).map(function (t) { return '<tr><td>' + esc(t.nombre) + '</td><td class="r num">' + t.cantidad + '</td><td class="r num">' + (t.margen_pct === null ? '—' : gs(t.importe_gs - t.costo_gs)) + '</td><td class="r num">' + (t.margen_pct === null ? '<span class="small muted">sin receta</span>' : t.margen_pct + ' %') + '</td></tr>'; }).join('') : '<tr><td class="muted">Sin ventas en el período.</td></tr>') +
      '</tbody></table></div><div class="card pad"><h2>Consumo de insumos</h2><table class="tbl" style="margin-top:8px"><tbody>' +
      (st.consumo.length ? st.consumo.slice(0, 15).map(function (c) { return '<tr><td>' + esc(c.nombre) + '</td><td class="r num">' + cant(c.cantidad, c.unidad) + '</td><td class="r num">' + gs(c.costo_gs) + '</td></tr>'; }).join('') : '<tr><td class="muted">Sin consumo en el período.</td></tr>') +
      '</tbody></table><p class="small muted">Compras del período: ' + gs(st.compras_gs) + '</p></div></div>' + h;
  }

  // ------------------------------------------------------------ resumen
  function kpi(l, v, sub) { return '<div class="card kpi"><div class="l">' + esc(l) + '</div><div class="v num">' + esc(v) + '</div>' + (sub ? '<div class="small muted">' + esc(sub) + '</div>' : '') + '</div>'; }
  function resumen() {
    var r = S.rep; if (!r) return '<div class="empty">Cargando…</div>';
    var ca = r.cajas.filter(function (c) { return c.caja_id === 'CAJA_A'; })[0] || {}, cb = r.cajas.filter(function (c) { return c.caja_id === 'CAJA_B'; })[0] || {};
    var maxTop = r.top_productos.length ? r.top_productos[0].cantidad : 1;
    var obj = function (o) { var k = Object.keys(o); return k.length ? k.map(function (x) { return esc(M.ESTADO_TXT[x] || x) + ': <strong>' + o[x] + '</strong>'; }).join(' · ') : '—'; };
    return '<div class="row wrap no-print" style="margin-bottom:12px"><label class="small">Desde <input type="date" class="input" id="desde" value="' + S.desde + '" style="width:auto"></label>' +
      '<label class="small">Hasta <input type="date" class="input" id="hasta" value="' + S.hasta + '" style="width:auto"></label><button class="btn prim" data-rep>Actualizar</button>' +
      '<button class="btn" data-csv>Exportar CSV</button><button class="btn" onclick="window.print()">Imprimir</button></div>' +
      '<p class="small muted">Ventas = cobros registrados menos reversos, según la fecha del movimiento. Período: ' + esc(r.desde) + ' a ' + esc(r.hasta) + '.</p>' +
      '<div class="kpis">' + kpi('Consolidado', gs(r.consolidado_gs)) + kpi('Caja 01 · Salón', gs(ca.ventas_netas_gs), (ca.cantidad_cobros || 0) + ' cobros') +
      kpi('Caja 02 · Para llevar', gs(cb.ventas_netas_gs), (cb.cantidad_cobros || 0) + ' cobros') + kpi('Pedidos', r.pedidos.total) + kpi('Cancelados', r.cancelados.length) +
      kpi('Preparación (mediana)', r.tiempos_preparacion_min.mediana !== undefined ? r.tiempos_preparacion_min.mediana + ' min' : '—', r.tiempos_preparacion_min.muestras + ' muestras') + '</div>' +
      '<div class="grid2" style="margin-top:14px"><div class="card pad"><h2>Ventas por caja y medio</h2><table class="tbl" style="margin-top:8px"><thead><tr><th>Caja</th><th>Medio</th><th class="r">Neto</th></tr></thead><tbody>' +
      r.cajas.map(function (c) {
        var ms = Object.keys(c.por_medio);
        return (ms.length ? ms : ['—']).map(function (m, i) { return '<tr><td>' + (i ? '' : esc(c.nombre)) + '</td><td>' + esc(m === '—' ? 'Sin cobros' : M.medioTxt(m)) + '</td><td class="r num">' + (m === '—' ? '' : gs(c.por_medio[m])) + '</td></tr>'; }).join('') +
          '<tr><td></td><td><strong>Total</strong>' + (c.reversos_gs ? ' <span class="small muted">(reversos ' + gs(c.reversos_gs) + ')</span>' : '') + (c.descuentos_gs ? ' <span class="small muted">(descuentos ' + gs(c.descuentos_gs) + ')</span>' : '') + '</td><td class="r num"><strong>' + gs(c.ventas_netas_gs) + '</strong></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="card pad"><h2>Pedidos</h2><p class="small">Por punto: ' + obj({ 'Salón': r.pedidos.por_punto.A_CAFE || 0, 'Para llevar': r.pedidos.por_punto.B_TAKEAWAY || 0 }) + '</p><p class="small">Por estado: ' + obj(r.pedidos.por_estado) + '</p><p class="small">Por origen: ' + obj(r.pedidos.por_origen) + '</p>' +
      '<p class="small muted">' + esc(r.tiempos_preparacion_min.nota || ('Tiempo aceptado→listo: promedio ' + r.tiempos_preparacion_min.promedio + ' min, mediana ' + r.tiempos_preparacion_min.mediana + ' min.')) + '</p></div></div>' +
      '<div class="grid2" style="margin-top:14px"><div class="card pad"><h2>Productos más vendidos</h2><table class="tbl" style="margin-top:8px"><tbody>' +
      (r.top_productos.length ? r.top_productos.map(function (t) { return '<tr><td>' + esc(t.nombre) + '<div class="bar" style="width:' + Math.round(t.cantidad / maxTop * 100) + '%"></div></td><td class="r num">' + t.cantidad + '</td><td class="r num">' + gs(t.importe_gs) + '</td></tr>'; }).join('') : '<tr><td class="muted">Sin ventas en el período.</td></tr>') +
      '</tbody></table></div><div class="card pad"><h2>Cancelaciones y reversos</h2><table class="tbl" style="margin-top:8px"><tbody>' +
      (r.cancelados.length ? r.cancelados.map(function (c) { return '<tr><td>' + esc(c.numero) + '<div class="small muted">' + esc(c.fecha) + '</div></td><td>' + esc(c.motivo) + '</td><td class="r num">' + gs(c.total_gs) + '</td></tr>'; }).join('') : '<tr><td class="muted">Sin cancelaciones.</td></tr>') +
      r.cobros_revertidos.map(function (c) { return '<tr><td>Cobro revertido<div class="small muted">' + esc(c.caja_id) + '</div></td><td>' + esc(c.motivo_reverso) + ' · autorizó ' + esc(c.revertido_por) + '</td><td class="r num">' + gs(c.total_gs) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>' + resumenStock(r) +
      '<div class="card pad" style="margin-top:14px"><h2>Turnos y cierres de caja</h2><div class="tbl-wrap"><table class="tbl" style="margin-top:8px"><thead><tr><th>Caja</th><th>Apertura</th><th>Cierre</th><th class="r">Ventas</th><th class="r">Esperado</th><th class="r">Contado</th><th class="r">Diferencia</th><th>Obs.</th></tr></thead><tbody>' +
      (r.cierres.length ? r.cierres.map(function (t) {
        return '<tr><td>' + esc(t.caja_id) + '</td><td>' + M.fechaHora(t.abierto_en) + '<div class="small muted">' + esc(t.abierto_por) + '</div></td><td>' + (t.estado === 'CERRADO' ? M.fechaHora(t.cerrado_en) + '<div class="small muted">' + esc(t.cerrado_por) + '</div>' : '<span class="chip oliva">Abierto</span>') + '</td>' +
          '<td class="r num">' + gs(t.totales.ventas_netas_gs) + '</td><td class="r num">' + (t.estado === 'CERRADO' ? gs(t.esperado_efectivo_gs) : gs(t.totales.efectivo_esperado_gs)) + '</td><td class="r num">' + (t.estado === 'CERRADO' ? gs(t.declarado_efectivo_gs) : '—') + '</td>' +
          '<td class="r num" style="color:' + (t.diferencia_gs ? 'var(--vino)' : 'inherit') + '">' + (t.estado === 'CERRADO' ? '<strong>' + gs(t.diferencia_gs) + '</strong>' : '—') + '</td><td class="small">' + esc(t.observacion || '') + '</td></tr>';
      }).join('') : '<tr><td colspan="8" class="muted">Sin turnos en el período.</td></tr>') + '</tbody></table></div></div>';
  }
  function csv() {
    var r = S.rep, rows = [['seccion', 'clave', 'detalle', 'valor_gs_o_cantidad']];
    r.cajas.forEach(function (c) { Object.keys(c.por_medio).forEach(function (m) { rows.push(['ventas', c.caja_id, m, c.por_medio[m]]); }); rows.push(['ventas', c.caja_id, 'TOTAL', c.ventas_netas_gs]); });
    rows.push(['ventas', 'CONSOLIDADO', '', r.consolidado_gs]);
    r.top_productos.forEach(function (t) { rows.push(['top_productos', t.producto_id, t.nombre, t.cantidad]); });
    r.cancelados.forEach(function (c) { rows.push(['cancelados', c.numero, c.motivo, c.total_gs]); });
    r.cierres.forEach(function (t) { rows.push(['cierres', t.caja_id, t.cerrado_en || 'abierto', t.diferencia_gs === undefined ? '' : t.diferencia_gs]); });
    if (r.stock) {
      rows.push(['costos', 'VENTAS_CON_RECETA', '', r.stock.ventas_con_costo_gs], ['costos', 'COSTO_INSUMOS', '', r.stock.costo_ventas_gs], ['costos', 'GANANCIA_BRUTA', '', r.stock.ganancia_bruta_gs]);
      r.stock.productos.forEach(function (t) { rows.push(['margen_plato', t.producto_id, t.nombre, t.margen_pct === null ? '' : t.importe_gs - t.costo_gs]); });
      r.stock.consumo.forEach(function (c) { rows.push(['consumo_insumo', c.insumo_id, c.nombre + ' (' + c.cantidad + ' ' + c.unidad + ')', c.costo_gs]); });
    }
    var txt = '﻿' + rows.map(function (x) { return x.map(function (v) { v = String(v === undefined ? '' : v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' }));
    a.download = 'reporte-' + r.desde + '_' + r.hasta + '.csv'; a.click();
  }

  // ------------------------------------------------------------ Upgrade "Armá tu pedido"
  function conArmador() { return S.admin.plan.modulos.indexOf('ARMADOR') >= 0; }
  var DIBUJOS = [['', 'Automático (por el nombre)'], ['QUESO', 'Queso / muzzarella'], ['CHEDDAR', 'Cheddar'], ['QUESO_CREMA', 'Queso crema / catupiry'], ['PEPPERONI', 'Pepperoni / salame'],
    ['JAMON', 'Jamón'], ['CHAMPINON', 'Champiñón'], ['ACEITUNA', 'Aceituna'], ['CEBOLLA', 'Cebolla'], ['CEBOLLA_CARAMELIZADA', 'Cebolla caramelizada'], ['MORRON', 'Locote / morrón'],
    ['TOMATE', 'Tomate'], ['ALBAHACA', 'Albahaca / hojas'], ['CHOCLO', 'Choclo'], ['ANANA', 'Ananá'], ['PALMITO', 'Palmito'], ['PANCETA', 'Panceta / bacon'], ['POLLO', 'Pollo'],
    ['CARNE', 'Carne / medallón'], ['HUEVO', 'Huevo'], ['LECHUGA', 'Lechuga'], ['PEPINO', 'Pepinillo'], ['JALAPENO', 'Jalapeño'], ['SALSA', 'Salsa (color por el nombre)'],
    ['PAN_BRIOCHE', 'Pan brioche / clásico'], ['PAN_NEGRO', 'Pan negro / integral'], ['PAN_PAPA', 'Pan de papa'], ['GENERICO', 'Otro (color propio)']];
  // ------------------------------------------------------------ estaciones (cocina, barra 1, barra 2…)
  function variasEst() { return (S.admin.estaciones || []).length > 1; }
  function estNombre(id) { var e = (S.admin.estaciones || []).filter(function (x) { return x.id === id; })[0]; return e ? e.nombre : id; }
  function estSelect(attr, valor, vacio) {
    return '<select class="input" ' + attr + '>' + (vacio ? '<option value="">' + esc(vacio) + '</option>' : '') +
      (S.admin.estaciones || []).map(function (e) { return '<option value="' + esc(e.id) + '"' + (e.id === valor ? ' selected' : '') + '>' + esc(e.nombre) + '</option>'; }).join('') + '</select>';
  }

  // ------------------------------------------------------------ catálogo
  function catalogo() {
    var m = S.admin.menu, cats = {}; m.categorias.forEach(function (c) { cats[c.id] = c; });
    var q = S.q.toLowerCase();
    var list = m.productos.filter(function (p) { return (!S.catFiltro || p.categoria === S.catFiltro) && (!q || p.nombre.toLowerCase().indexOf(q) >= 0); });
    var porValidar = m.productos.filter(function (p) { return p.validacion !== 'APROBADO'; }).length;
    return (porValidar ? '<div class="banner warn" style="border-radius:8px;margin-bottom:12px">' + porValidar + ' productos con precio <strong>POR VALIDAR</strong>. Revisalos con el dueño o el encargado del local y marcá “Aprobado” en cada uno antes de imprimir los QR definitivos.</div>' : '') +
      '<div class="row wrap" style="margin-bottom:12px"><select class="input" id="catf" style="width:auto"><option value="">Todas las categorías</option>' +
      m.categorias.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === S.catFiltro ? ' selected' : '') + '>' + esc(c.nombre) + (c.activa ? '' : ' (oculta)') + '</option>'; }).join('') + '</select>' +
      '<input class="input" id="q" placeholder="Buscar…" value="' + esc(S.q) + '" style="width:auto;flex:1;min-width:160px"><button class="btn prim" data-newprod>+ Producto</button><button class="btn" data-cats>Categorías</button><button class="btn" data-cartaia title="Leer la carta desde fotos o un PDF">📷 Cargar carta con IA</button></div>' +
      '<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Producto</th><th>Categoría</th><th class="r">Precio</th><th>Puntos</th><th>Estado</th><th>Validación</th><th></th></tr></thead><tbody>' +
      list.map(function (p) {
        return '<tr><td><strong>' + esc(p.nombre) + '</strong><div class="small muted">' + esc(p.id) + (p.grupos.length ? ' · opciones: ' + esc(p.grupos.join(', ')) : '') + (p.dias ? ' · <strong>solo ' + esc(p.dias.split(',').map(function (d) { return ['', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'][+d]; }).join(', ')) + '</strong>' : '') + '</div>' + (p.nota ? '<div class="small" style="color:#7a5a14">' + esc(p.nota) + '</div>' : '') + '</td>' +
          '<td class="small">' + esc(cats[p.categoria] ? cats[p.categoria].nombre : p.categoria) + (variasEst() ? '<div><span class="chip' + (p.estacion ? ' mostaza' : '') + '" title="Estación que prepara este producto">' + esc(estNombre(p.estacion_efectiva)) + '</span></div>' : '') + '</td><td class="r num">' + gs(p.precio) + '</td>' +
          '<td class="small">' + esc(p.puntos.replace('A_CAFE', 'Salón').replace('B_TAKEAWAY', 'Para llevar').replace(',', ', ')) + '</td>' +
          '<td>' + (p.activo ? '' : '<span class="chip">Inactivo</span> ') + '<button class="btn small ' + (p.disponible ? '' : 'danger') + '" data-disp="' + esc(p.id) + '">' + (p.disponible ? 'Disponible' : 'Agotado') + '</button></td>' +
          '<td><span class="chip ' + (p.validacion === 'APROBADO' ? 'oliva' : 'mostaza') + '">' + esc(p.validacion === 'APROBADO' ? 'Aprobado' : 'Por validar') + '</span></td>' +
          '<td><button class="btn small" data-edit="' + esc(p.id) + '">Editar</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  function editProd(id) {

  function recClick(e) {
    var t;

      S.recPremios.push({ tipo: tipo, sellos: tipo === 'CUMPLE' ? 0 : max + 4, nombre: '', producto_id: '', valor_gs: '', costo_gs: '' }); render(); return true;
    }
    if ((t = e.target.closest('[data-rpdel]'))) { S.recPremios.splice(+t.getAttribute('data-rpdel'), 1); render(); return true; }

      var pl = S.recPremios.map(function (p) { return { premio_id: p.premio_id, tipo: p.tipo, sellos: +p.sellos || 0, nombre: p.nombre, producto_id: p.producto_id, valor_gs: M.parseGs(p.valor_gs), costo_gs: M.parseGs(p.costo_gs) }; });

      return true;

      var P = S.rec.programa, link = S.base.replace(/\/?$/, '/') + 'tarjeta.html';

      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'clientes-recompensas.csv'; a.click();

    var u = e.target.closest('[data-upg]');
    if (u) {
      var mod = u.getAttribute('data-upg'), on = u.getAttribute('data-upg-on') === 'SI', nom = UPG_TXT[mod] || mod, notaU = (M.$('#licnota') || {}).value || '';
      M.confirmar(on ? 'Activar ' + nom : 'Desactivar ' + nom, on ? 'El local suma ' + nom + ' (se cobra aparte del plan). Las pantallas se actualizan solas.' : 'El local deja de ver ' + nom + '.', 'Confirmar').then(function (ok) {
        if (!ok) return;
        M.call('plataforma.upgrade', { modulo: mod, activo: on, nota: notaU }).then(function (r) { S.lic = r; M.toast(nom + (on ? ' activado' : ' desactivado'), 'ok'); reload().then(render); }, err);
      });
      return true;
    }
    var t = e.target.closest('[data-lic]'); if (!t) return false;
    var plan = t.getAttribute('data-lic'), nota = (M.$('#licnota') || {}).value || '', p3 = ((M.$('#lic3d') || {}).value || '').trim();
    M.confirmar('Cambiar plan', plan ? 'El local pasa a ' + PLAN_TXT[plan] + '. Las pantallas se actualizan solas.' : 'El local vuelve al plan del despliegue.', 'Confirmar').then(function (ok) {
      if (!ok) return;
      M.call('plataforma.plan', { plan: plan, nota: nota, platos_3d: p3 === '' ? '' : parseInt(p3, 10) }).then(function (r) { S.lic = r; M.toast('Plan actualizado: ' + (PLAN_TXT[r.plan] || r.plan), 'ok'); Promise.all([reload(), cargarRec(), cargarRes()]).then(render); }, err);
    });
    return true;
  }

  // ------------------------------------------------------------ eventos
  function onClick(e) {
    var t;
    if (S.vista === 'recompensas' && recClick(e)) return;
    if (S.vista === 'resenas' && resClick(e)) return;
    if (S.vista === 'licencia' && licClick(e)) return;
    if ((t = e.target.closest('[data-tab]'))) { S.vista = t.getAttribute('data-tab'); if (S.vista === 'auditoria') S.audit = null; if (S.vista === 'recompensas') { S.recPremios = null; return cargarRec().then(render); } if (S.vista === 'resenas') return cargarRes().then(render); if (S.vista === 'licencia') { S.lic = null; return M.call('plataforma.estado', {}).then(function (r) { S.lic = r; render(); }, err); } render(); return; }
    if (e.target.closest('[data-rep]')) { S.desde = M.$('#desde').value; S.hasta = M.$('#hasta').value; M.call('admin.report', { desde: S.desde, hasta: S.hasta }).then(function (r) { S.rep = r; render(); }, err); return; }
    if (e.target.closest('[data-csv]')) { csv(); return; }
    if ((t = e.target.closest('[data-edit]'))) { editProd(t.getAttribute('data-edit')); return; }
    if (e.target.closest('[data-newprod]')) { editProd(null); return; }
    if (e.target.closest('[data-cats]')) { editCats(); return; }
    if (e.target.closest('[data-cartaia]')) { CartaIAUI.abrir(M, { categorias: S.admin.menu.categorias.map(function (c) { return c.nombre; }), listo: function () { reload(); } }); return; }
    if ((t = e.target.closest('[data-disp]'))) {
      var p = S.admin.menu.productos.filter(function (x) { return x.id === t.getAttribute('data-disp'); })[0];
      M.call('product.availability', { producto_id: p.id, disponible: !p.disponible }).then(function () { reload(); }, err); return;
    }
    if ((t = e.target.closest('[data-editgrp]'))) { editGrupo(t.getAttribute('data-editgrp')); return; }
    if (e.target.closest('[data-savebase]')) { S.base = M.$('#base').value.trim(); try { localStorage.setItem('mesapyae.baseUrl', S.base); } catch (x) { } render(); return; }
    if (e.target.closest('[data-newmesa]')) { editMesa(null); return; }
    if ((t = e.target.closest('[data-editmesa]'))) { editMesa(t.getAttribute('data-editmesa')); return; }
    if ((t = e.target.closest('[data-qr]'))) { verQr(t.getAttribute('data-qr')); return; }
    if (e.target.closest('[data-printqr]')) {
      var tk = S.admin.puntos.filter(function (x) { return x.punto_id === 'B_TAKEAWAY' && x.activo !== 'NO'; })[0];
      printQr(S.admin.mesas.filter(function (m) { return m.activa === 'SI'; }).map(function (m) { return qrCard(m.nombre, m.qr_token); }).concat(tk ? [qrCard('Para llevar', tk.qr_token, 'Pedí desde tu celular y retirá en el mostrador')] : []));
      return;
    }
    if ((t = e.target.closest('[data-rot]')) || (t = e.target.closest('[data-rotp]'))) {
      var mesaId = t.getAttribute('data-rot'), punto = t.getAttribute('data-rotp');
      M.confirmar('Nuevo código QR', 'El QR impreso actual deja de funcionar y hay que imprimir el nuevo. ¿Continuar?', 'Generar nuevo', true).then(function (ok) {
        if (ok) M.call('admin.rotateQr', mesaId ? { mesa_id: mesaId } : { punto_id: punto }).then(function () { M.toast('Código regenerado. Imprimí el nuevo QR.', 'ok'); reload(); }, err);
      });
      return;
    }
    if (e.target.closest('[data-verinact]')) { S.verInactivos = !S.verInactivos; render(); return; }
    if ((t = e.target.closest('[data-edituser]'))) { editUser(t.getAttribute('data-edituser')); return; }
    if ((t = e.target.closest('[data-kick]'))) {
      var uid = t.getAttribute('data-kick');
      M.confirmar('Cerrar sesiones', 'Todos los dispositivos de ' + uid + ' deberán volver a ingresar.', 'Cerrar sesiones').then(function (ok) {
        if (ok) M.call('auth.logoutAll', { usuario_id: uid }).then(function () { M.toast('Sesiones cerradas.', 'ok'); if (uid === M.session.usuario.usuario_id) M.logout(); }, err);
      });
      return;
    }
    if ((t = e.target.closest('[data-savecfg]'))) {
      var k = t.getAttribute('data-savecfg');
      M.call('admin.config', { clave: k, valor: M.$('[data-cfg="' + k + '"]').value }).then(function () { M.toast('Guardado.', 'ok'); reload(); }, err); return;
    }
    if (e.target.closest('[data-reaudit]')) { S.audit = null; render(); return; }
  }
  function onChange(e) { if (S.vista === 'recompensas' && recChange(e)) return; if (e.target.id === 'catf') { S.catFiltro = e.target.value; render(); } }
  function onInput(e) {
    if (e.target.id === 'recq') { S.recQ = e.target.value; var p2 = e.target.selectionStart; render(); var q2 = M.$('#recq'); q2.focus(); q2.setSelectionRange(p2, p2); return; }
    if (e.target.matches && e.target.matches('[data-rp]')) { S.recPremios[+e.target.getAttribute('data-rp')][e.target.getAttribute('data-k')] = e.target.value; return; }
    if (e.target.id === 'q') { S.q = e.target.value; var pos = e.target.selectionStart; render(); var q = M.$('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  }
  function err(e) { M.toast(e.message || 'Error', 'error'); }
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});</script>
</body>
