<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F3EDE1">
<title>Contanos cómo estuvo · Tu Local Gastronómico</title>
<link rel="icon" href="assets/logo-local.png">
<link rel="stylesheet" href="assets/app.css">
<style>
  body.publico { background: var(--crema); }
  .rs-wrap { max-width: 460px; margin: 0 auto; padding: 22px 16px 48px; }
  .rs-head { text-align: center; margin-bottom: 16px; }
  .rs-head img { width: 130px; }
  .rs-head .donde { font-family: var(--f-tit); letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; color: var(--tinta-2); }
  .rs-wrap h1 { text-align: center; font-size: 1.4rem; margin: 6px 0 2px; }
  .estrellas { justify-content: center; }
  footer.pub { text-align: center; font-size: .74rem; color: var(--tinta-3); padding: 24px 0 0; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body class="publico">
<div class="rs-wrap" id="app"><div class="rs-head"><img src="assets/logo-local.png" alt="Tu Local Gastronómico"></div><div class="empty">Cargando…</div></div>
<script src="assets/config.js"></script>
<script src="assets/lib.js"></script>
<script>
(function () {
  var M = Mesa, esc = M.esc;
  var token = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-z0-9]/g, '');
  var info = null, n = 0, enviado = null;
  function head() { return '<div class="rs-head"><img src="assets/logo-local.png" alt="Tu Local Gastronómico"><div class="donde">' + esc(info && info.mesa || '') + '</div></div>'; }
  function pie() { return '<footer class="pub"><span class="mp-pie">powered by<img src="assets/mesapyae-logo.png" alt="Mesa Pya\'e by Ser o Límites"></span></footer>'; }
  if (!token) { M.$('#app').innerHTML = head() + '<div class="card pad">Escaneá el QR de tu mesa para dejarnos tu opinión.</div>'; return; }
  M.call('public.resenaInfo', { token: token }, { publico: true, retries: 2 }).then(function (d) { info = d; render(); }, function (e) {
    M.$('#app').innerHTML = head() + '<div class="card pad">' + esc(e.message || 'No disponible.') + '</div>';
  });
  function render() {
    var g = info.google_url ? '<div class="resena-google"><span class="small">¿Te gustaría compartir tu experiencia en Google?</span><a class="btn block" id="g" target="_blank" rel="noopener" href="' + esc(info.google_url) + '">Dejar una reseña en Google</a></div>' : '';
    M.$('#app').innerHTML = head() + (enviado ?
      '<div class="card pad" style="text-align:center"><h1>¡Gracias!</h1><p>Tu opinión le llega directo al equipo de ' + esc(info.negocio) + '.</p>' + (enviado.sello ? '<p class="small">Sumaste un sello: ' + enviado.sello.sellos + ' de ' + enviado.sello.meta + '.</p>' : '') + g + '</div>' :
      '<div class="card pad"><h1>' + esc(info.pregunta) + '</h1><p class="small muted" style="text-align:center;margin:0">Tu respuesta llega solo al equipo del local.</p>' +
      '<div class="estrellas" role="radiogroup" aria-label="Calificación">' + [1, 2, 3, 4, 5].map(function (k) { return '<button type="button" class="estrella' + (k <= n ? ' on' : '') + '" data-st="' + k + '" aria-label="' + k + ' estrella' + (k > 1 ? 's' : '') + '">★</button>'; }).join('') + '</div>' +
      '<label class="f" for="c">Comentario (opcional)</label><textarea class="input" id="c" maxlength="500" style="min-height:90px" placeholder="Qué te gustó, qué podemos mejorar"></textarea>' +
      '<button class="btn prim big block" id="ok" style="margin-top:10px"' + (n ? '' : ' disabled') + '>Enviar</button>' + g + '</div>') + pie();
    var app = M.$('#app');
    M.$$('[data-st]', app).forEach(function (b) { b.onclick = function () { var c = M.$('#c').value; n = +b.getAttribute('data-st'); render(); M.$('#c').value = c; }; });
    if (M.$('#ok')) M.$('#ok').onclick = function () {
      var b = this; b.disabled = true;
      M.call('public.resena', { token: token, estrellas: n, comentario: M.$('#c').value.trim(), request_id: M.uid() }, { publico: true, retries: 2 }).then(function (r) { enviado = r; render(); }, function (e) { b.disabled = false; M.toast(e.message, 'error'); });
    };
    if (M.$('#g')) M.$('#g').addEventListener('click', function () { M.call('public.resenaGoogle', { resena_id: enviado ? enviado.resena_id : '' }, { publico: true }).catch(function () { }); });
  }
})();
</script>
</body>
</html>
